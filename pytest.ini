[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --strict-markers
    --cov=anyrun_client
    --cov=analyzer
    --cov=incident_response
    --cov=reporter
    --cov=ml_engine
    --cov=validation
    --cov=siem_exporter
    --cov=evidence
    --cov=analysis_agent
    --cov=case_agent
    --cov=deep_analysis
    --cov=report_context
    --cov=network_intel
    --cov=impact_analysis
    --cov=remediation
    --cov=analysis_pipeline
    --cov=case_store
    --cov=mitre_mapping
    --cov=markdown_importer
    --cov=evaluation
    --cov=response_policy
    --cov=runtime_setup
    --cov=ghidra_analyzer
    --cov=history_store
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, multiple components)
    performance: Performance benchmarks
    slow: Tests that take more than one second
